apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: sample-node
  namespace: argocd
spec:
  description: application
  sourceRepos:
    - https://github.com/einatsh/sample-nodejs.git
    - https://github.com/einatsh/sample-nodejs-gitops.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: sample-node-*
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  orphanedResources:
    warn: true