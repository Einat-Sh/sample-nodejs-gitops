apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample-node-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: sample-node
  sources:
    - repoURL: https://github.com/Einat-Sh/sample-nodejs.git
      targetRevision: main
      path: helm/sample-node
      helm:
        valueFiles:
          - $values/apps/sample-nodejs/dev/values.yaml
    - repoURL: https://github.com/Einat-Sh/sample-nodejs-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: sample-node-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
